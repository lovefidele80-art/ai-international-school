<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07101f">
  <meta name="description" content="AI International School">
  <title>AI International School</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #07101f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: #6ea8fe;
      color: #07101f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: 1.05;
    }

    p {
      color: #aab6c8;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .status {
      margin: 32px auto 0;
      padding: 20px;
      max-width: 600px;
      border: 1px solid #263650;
      border-radius: 16px;
      background: #0d182b;
    }

    .status strong {
      color: #69d39a;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">AI</div>

    <h1>AI International School</h1>

    <p>
      Welcome to the beginning of a new international learning platform.
    </p>

    <div class="status">
      <strong>BUILD TEST 1 — SUCCESS</strong>
      <p>
        The AI International School repository is working.
      </p>
    </div>

  </main>

</body>
</html>
