<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your AI International School account.">
  <meta name="theme-color" content="#ffffff">
  <title>Sign Up - AI International School</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-container">

      <a href="index.html" class="auth-brand">
        AI International School
      </a>

      <div class="auth-card">

        <div class="auth-heading">
          <span class="section-label">Start learning</span>

          <h1>Create your account</h1>

          <p>
            Join AI International School and start your learning journey.
          </p>
        </div>

        <form id="signupForm">

          <div class="form-group">
            <label for="fullName">Full Name</label>

            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            >
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            >
          </div>

          <div class="form-group">
            <label for="educationLevel">Education Level</label>

            <select id="educationLevel" name="educationLevel" required>
              <option value="">Select your level</option>
              <option value="primary">Primary - P1 to P6</option>
              <option value="ordinary">Ordinary - S1 to S3</option>
              <option value="secondary">Secondary - S4 to S6</option>
              <option value="vocational">Vocational Programs</option>
            </select>
          </div>

          <div class="form-check">
            <input
              type="checkbox"
              id="terms"
              name="terms"
              required
            >

            <label for="terms">
              I agree to the terms and conditions.
            </label>
          </div>

          <button type="submit" class="btn btn-primary auth-submit">
            Create Account
          </button>

          <p class="auth-message" id="signupMessage"></p>

        </form>

        <div class="auth-footer">
          <span>Already have an account?</span>
          <a href="login.html">Login</a>
        </div>

      </div>

      <a href="index.html" class="back-home">
        Back to Home
      </a>

    </div>

  </main>

  <script src="js/app.js"></script>

</body>
</html>
